<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini cómic — ¡Que llueva!</title>
<meta name="description" content="Un espacio interactivo para leer una nueva aventura ilustrada de ¡Que llueva!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/comic.css">
</head>
<body class="comic-page">
<div id="comic-progress" class="progress-indicator" style="width:20%"></div>

<header class="site-nav">
  <a class="brand" href="index.html">¡Que llueva!</a>
  <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
  <nav class="nav-links" data-open="false" aria-label="Navegación principal">
    <a href="index.html">Volver al cuento</a>
    <a href="#comic-reader" aria-current="true">Mini cómic</a>
  </nav>
</header>

<main id="comic-reader" class="comic-reader">
  <div class="comic-inner">
    <header class="comic-heading">
      <h1>Mini cómic</h1>
    </header>

    <section class="comic-sequence" aria-label="Lector interactivo de mini cómic">
      <div id="comic-frame" class="comic-frame" role="group" aria-label="Viñeta del mini cómic">
        <div id="comic-art" class="comic-art"></div>
        <span id="comic-page-number" class="comic-page-number"></span>
      </div>
      <div class="comic-controls">
        <button id="comic-previous" class="comic-control" type="button" aria-label="Página anterior">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          <span>Anterior</span>
        </button>
        <div id="comic-page-list" class="comic-page-list" role="group" aria-label="Volver a páginas anteriores"></div>
      </div>
      <p id="comic-status" class="comic-status visually-hidden" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>

<button class="back-to-top" type="button" data-scroll-to="#comic-reader" aria-label="Volver arriba" title="Volver arriba">
  <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="js/data.js"></script>
<script src="js/navigation.js"></script>
<script src="js/comic.js"></script>
</body>
</html>
